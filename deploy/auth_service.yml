services:
  auth:
    container_name: ${AUTH_NAME}
    build:
      context: ../ecommerce
      dockerfile: auth-service/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-dev}
      target: run
    restart: always
    depends_on:
      auth_db:
        condition: service_healthy
    expose:
      - "${GRPC_PORT}"
    environment:
      GRPC_PORT: ${GRPC_PORT}
      DB_HOST: auth_db
      DB_NAME: auth
      DB_PORT: ${DB_PORT}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:${GRPC_PORT}"]
      start_period: 5s
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["run"]

  auth_db:
    image: mariadb:latest
    restart: always
    expose:
      - "${DB_PORT}"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ../ecommerce/auth-service/db/setup.sql:/docker-entrypoint-initdb.d/init.sql
      - auth_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      start_interval: 10s
      interval: 60s
      timeout: 15s
      retries: 10
    networks:
      - ecommerce_net
    profiles: ["run"]

networks:
  ecommerce_net:
    name: ecommerce_net

volumes:
  auth_db:
