syntax = "proto3";

package order;

option go_package = "ecommerce/proto/order";

enum Status {
    UNSPECIFIED = 0;
    PROCESSING = 1;
    SHIPPED = 2;
    DELIVERED = 3;
    CANCELED = 4;
}

// Represents a single product into an order
message OrderItem {
    string product_code = 1;
    string name = 2;
    double price = 3;
    uint32 quantity = 4;
}

// Represents the entire order
message Order {
    int32 order_id = 1;
    string username = 2;
    Status status = 3;
    repeated OrderItem items = 4;
    double total_amount = 5;
}

// ORDER CREATION
message CreateOrderRequest {
    string username = 1;
    repeated OrderItem items = 2;
}

message CreateOrderResponse {
    bool success = 1;
    int32 order_id = 2;
    string error_message = 3;
}

// ORDER RETRIEVAL
message GetOrderRequest {
    int32 order_id = 1;
}

message GetOrderResponse {
    bool success = 1;
    Order order = 2;
    string error_message = 3;
}

// UPDATE ORDER STATUS
message UpdateOrderStatusRequest{
    int32 order_id = 1;
    Status status = 2;
}

message UpdateOrderStatusResponse{
    bool success = 1;
    string error_message = 2;
}

// LIST ORDERS BY USER
message ListOrdersByUsernameRequest {
    string username = 1;
}

message ListOrdersByUsernameResponse {
    bool success = 1;
    repeated Order orders = 2;
    string error_message = 3;
}

// LIST ALL ORDERS
message ListAllOrdersRequest {}

message ListAllOrdersResponse {
    bool success = 1;
    repeated Order orders = 2;
    string error_message = 3;
}

// SERVICES
service OrderService {
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
    rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
    rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
    rpc ListOrdersByUsername(ListOrdersByUsernameRequest) returns (ListOrdersByUsernameResponse);
    rpc ListAllOrders(ListAllOrdersRequest) returns (ListAllOrdersResponse);
}