{{template "header.html" .}}
<style>
    .product-form {
        max-width: 500px;
        margin: 30px auto;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .product-form h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .product-form label {
        font-weight: bold;
        display: block;
        margin-bottom: 6px;
    }

    .product-form input[type="text"],
    .product-form input[type="number"],
    .product-form select,
    .product-form textarea {
        width: 100%;
        padding: 8px 10px;
        border-radius: 4px;
        border: 1px solid #ccc;
        margin-bottom: 15px;
        font-size: 14px;
        box-sizing: border-box;
    }

    .product-form textarea {
        resize: vertical;
        min-height: 80px;
    }

    .product-form .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        color: white;
    }

    .btn-primary {
        background: #28a745;
    }

    .btn-primary:hover {
        background: #208337;
    }

    .btn-secondary {
        background: #dc3545;
        margin-top: 10px;
    }

    .btn-secondary:hover {
        background: #9c2632;
    }
</style>

<form action="/app/product/{{.Product.Code}}/edit" method="POST" class="product-form">
    <h2>Edit Product</h2>

    <label for="code">Code:</label>
    <span id="code">{{.Product.Code}}</span>
    <input type="hidden" name="code" value="{{.Product.Code}}">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="{{.Product.Name}}" required>

    <label for="size">Size:</label>
    <select id="size" name="size" required>
        <option value="">-- Select size --</option>
        {{range .Sizes}}
        <option value="{{.}}" {{if eq . $.Product.Size}}selected{{end}}>{{.}}</option>
        {{end}}
    </select>

    <label for="color">Color:</label>
    <input type="text" id="color" name="color" value="{{.Product.Color}}" required>

    <label for="description">Description:</label>
    <textarea id="description" name="description" required>{{.Product.Description}}</textarea>

    <label for="stock">Availability (stock):</label>
    <input type="number" id="stock" name="stock" min="0" value="{{.Product.Stock}}" required>

    <label for="price">Price (€):</label>
    <input type="number" step="0.01" id="price" min="0" name="price" value="{{.Product.Price}}" required>

    <button type="submit" class="btn btn-primary">Update Product</button>
    <button type="button" class="btn btn-secondary"
        onclick="if(confirm('Are you sure you want to cancel changes?')) { window.location.href='/app/product/'; }">Cancel</button>
</form>

{{template "footer.html" .}}
