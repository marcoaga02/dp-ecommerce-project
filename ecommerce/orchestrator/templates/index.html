{{template "header.html" .}}
<style>
    .welcome-container {
        max-width: 600px;
        margin: 40px auto;
        text-align: center;
    }

    .welcome-container h1 {
        margin-bottom: 10px;
    }

    .welcome-container {
        max-width: 900px;
        margin: 40px auto;
        text-align: center;
    }

    .welcome-panels {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .panel {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .panel h2 {
        margin-bottom: 15px;
    }

    .btn-link {
        display: inline-block;
        background: #007bff;
        color: white;
        padding: 10px 16px;
        border-radius: 4px;
        text-decoration: none;
        font-size: 16px;
    }

    .btn-link:hover {
        background: #0056b3;
    }
</style>

<div class="welcome-container">
    <h1>Welcome to My Ecommerce</h1>
    <p>Where you can buy clothes for every occasion</p>
    <div class="welcome-panels">

        {{if eq .Role "administrator"}}
        <section class="panel">
            <h2>Administrator Panel</h2>
            <p><a href="/app/admin/users" class="btn-link">Manage All Users</a></p>
            <p><a href="/app/order/all" class="btn-link">Manage All Orders</a></p>
        </section>
        {{end}}

        <section class="panel">
            <h2>Client Panel</h2>
            <p><a href="/app/product/" class="btn-link">Browse Products</a></p>
            <p><a href="/app/order/" class="btn-link">Browse Your Orders</a></p>
        </section>
    </div>
</div>

{{template "footer.html" .}}
